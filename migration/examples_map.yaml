# Not mapped to a page: copied to legacy/unmapped-examples/ so warpSPH/examples can be deleted safely.
unmapped:
  - weaklyCompressible/naca.ipynb
  - weaklyCompressible/acousticCore_implicit_vs_explicit.ipynb
  - weaklyCompressible/utils.py
  - incompressible/1d-test.ipynb
# Not copied at all: *_PLAN.md / MIGRATION_*.md / EXAMPLES_SUMMARY.md (superseded by this repo), outputs/, export/, media.
