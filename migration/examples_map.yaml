# Page inventory + where each page's source material comes from in warpSPH/examples/.
# Read by scripts/migrate_examples.py (copies sources into cases/<family>/<slug>/from-examples/
# and writes a skeleton case.yaml). Paths are relative to warpSPH/examples/.
# `cases` are the registered warpSPH case names (checked against the registry).
# Media (mp4/avi/gif/png outputs) is never migrated; neither is anything under */export/.

compressible:
  sod:
    title: Sod shock tube
    cases: [sod, sod2d, sod3d]
    solvers: [compressible]
    sources: [compressible/01-sod/*.ipynb, compressible/01-sod/*.py, sweeps/sod_highres.yaml]
  linear-wave:
    title: Linear acoustic wave
    cases: [linearWave]
    solvers: [compressible]
    sources: [compressible/02-linear-wave.*]
  kidder:
    title: Kidder isentropic compression
    cases: [kidder]
    solvers: [compressible]
    sources: [compressible/03-kidder-isentropic-compression.*]
  noh:
    title: Noh implosion
    cases: [noh]
    solvers: [compressible]
    sources: [compressible/04-noh-implosion.*]
  shearing-noh:
    title: Shearing Noh implosion
    cases: [shearingNoh]
    solvers: [compressible]
    sources: [compressible/11-shearing-noh-implosion-2d.*]
  woodward-colella:
    title: Woodward-Colella blast waves
    cases: [woodwardColella]
    solvers: [compressible]
    sources: [compressible/05-woodward-colella.*]
  sedov:
    title: Sedov-Taylor blast wave
    cases: [sedov]
    solvers: [compressible]
    sources: [compressible/06-sedov/*.ipynb, compressible/06-sedov/*.py]
  hydrostatic:
    title: Hydrostatic equilibrium
    cases: [hydrostatic]
    solvers: [compressible]
    sources: [compressible/08-hydrostatic.*]
  gresho:
    title: Gresho-Chan vortex
    cases: [gresho]
    solvers: [compressible]
    sources: [compressible/09-gresho-chan-vortex.*]
  yee:
    title: Yee isentropic vortex
    cases: [yee]
    solvers: [compressible]
    sources: [compressible/10-yee-vortex.*]
  shear-box:
    title: Periodic shear box
    cases: [shearBox]
    solvers: [compressible]
    sources: []
  kelvin-helmholtz:
    title: Kelvin-Helmholtz instability
    cases: [kelvinHelmholtz]
    solvers: [compressible]
    sources: [compressible/12-kelvin-helmholtz.*]
  rayleigh-taylor:
    title: Rayleigh-Taylor instability
    cases: [rayleighTaylor]
    solvers: [compressible]
    sources: [compressible/13-rayleigh-taylor.*]
  triple-point:
    title: Triple point
    cases: [triplePoint]
    solvers: [compressible]
    sources: [compressible/14-triplePoint/*.ipynb, compressible/14-triplePoint/*.py]

