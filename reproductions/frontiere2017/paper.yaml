format: research-draft-v1
paper: frontiere2017
source:
  doi: 10.1016/j.jcp.2016.12.004
  document: frontiere2017_crksph.pdf
  sha256: 0e3c7cad7fa581f171d3092dfe89abc95d3c8397fd7abe92263afc2b841c7485
revision: 3
status: definition-draft
scope:
  primary: Section 4 dynamics evaluations, including dimensional and shear variants
  families: 14
  initial_solver: CRKSPH
  exclusions:
  - Appendix interpolation/operator tests are a separate unit-test track.
  - Section 4.6 timing repeats Noh; no new dynamics study or timing acceptance target.
  - Other solvers are selected comparisons, not a Cartesian product with all resolutions.
numerical_protocol:
  source_pdf_pages:
  - 13
  - 14
  kernel: seventh-order B-spline W7 (B7)
  radial_support_in_particle_spacings: 4
  paper_n_h: 1
  warpsph_support_radius_n_h_candidate: 4
  support_convention_note: Paper n_h counts particles per smoothing scale; warpSPH n_h counts support-radius
    spacings. Verify actual neighbor distribution, not parameter spelling.
  time_integrator: modified second-order Runge-Kutta
  cfl: 0.25
  viscosity:
    C_l: 2
    C_q: 1
    limiter: Section 3.2
  energy_update: compatible; Kidder additionally compares total-energy evolution
  precision_policy: Use float64 for the initial acoustic/convergence pilot; record precision for every run.
  parity_gates:
  - Reconcile adaptive support and volume/density evaluation with Eqs. (75)-(76).
  - Reconcile viscosity limiter and energy update against the implemented CRKSPH; an enum match alone is insufficient.
  - Resolve every published IC, boundary and sampling difference before labelling a recording a paper reproduction.
  reflecting_boundary_realization:
    method: reflected-initial-conditions-periodic
    accepted_by_user: '2026-10-19'
    copies: 2**k for k reflected axes; 2/4/8 when all axes reflect in 1D/2D/3D
    scalar_parity: Copy density, pressure, energy and material/origin labels unchanged.
    velocity_parity: Reverse each velocity component normal to its reflected plane; preserve tangential components.
    measurement_region: Use the physical paper domain, excluding reflected copies from profiles and integral
      normalizations.
    scope: Stationary planar slip/symmetry walls; prescribed-state boundaries such as Kidder/Yee/RT remain
      study-specific.
    policy: A dedicated reflecting-wall solver is not a prerequisite; verify the IC transform and physical
      particle counts.
execution_policy:
  status: not-executable-yet
  reason: Definitions and builder candidates are not resolved runner configurations. Each study lists the remaining
    setup checks.
  first_wave:
  - section-4-1-acoustic
  - section-4-3-1-sod-1d
  - section-4-3-2-sedov-1d
  - section-4-3-3-noh-1d
  - section-4-4-1-gresho
  - section-4-4-2-yee
  second_wave:
  - section-4-0-1-kidder
  - section-4-2-hydrostatic
  - section-4-3-4-woodward
  - section-4-4-3-kh
  - section-4-4-4-rt
  - section-4-4-5-shearing-noh-vs1
  - section-4-4-5-shearing-noh-vs5
  later_wave: 3D and additional dimensional studies, blob, and the mixed-gamma triple point after capability
    checks
  convergence: Use the published acoustic/Yee resolution lists once the metric and one representative run are
    checked. Extract Fig. 11 shock resolutions before a paper-matched sweep.
study_groups:
  blob:
    setup:
      eos: ideal-gas
      gamma: 1.6666666666666667
      ambient_density: 1
      cloud_density: 10
      pressure: 1
      cloud_radius: 1
      cloud_initial_velocity: zero
      ambient_mach: 2.7
      boundaries: periodic
      initialization: cloud excised from ambient lattice and filled with equal-mass particles
      tau_crush: 2 * cloud_radius * sqrt(cloud_density / ambient_density) / wind_speed
      tau_KH: 1.6 * tau_crush
    measurement:
      locator: Section 4.5.1 PDF page 33; Fig. 23 on page 34
      cloud_mass_criterion:
        density: rho > 0.64 * initial_cloud_density
        temperature: T < 0.9 * initial_ambient_temperature
        population: all gas particles satisfying both criteria; not initial cloud IDs only
      normalization: retained mass / initial cloud mass
      time_coordinate: t / tau_KH
      interpretation: Cross-method published comparison; late nonlinear evolution depends on interface perturbations.
studies:
- id: section-4-0-1-kidder
  section: 4.0.1
  source_pdf_pages:
  - 13
  - 14
  - 15
  core_family: kidder
  registry_case: kidder
  binding: existing-builder-needs-reconciliation
  priority: P1
  dimension: 1
  figure_targets:
  - '1: entropy ratio; compatible versus total energy'
  setup:
    domain:
    - 0.9
    - 1
    gamma: 3
    inner_pressure: 0.1
    outer_pressure: 10
    outer_density: 0.01
    initial_velocity: 0
    boundaries: Analytic time-dependent state on inner and outer 10 particles; these are included in the 100
      points.
  published_sampling:
    total_particles: 100
    boundary_particles_per_end: 10
  comparison_times:
    t_over_tau:
    - 0.99
  reference:
    kind: analytic
    locator: Eqs. (83)-(93)
  measurement:
    entropy-ratio: P/rho**gamma divided by analytic initial entropy, plotted against current radius; score
      only evolving particles.
    energy-drift: Track total energy separately from entropy error; boundary work must be accounted for.
  setup_gaps:
  - Override outer pressure 1 to 10 and verify gamma is derived from nu=1.
  - Confirm the count of active/boundary nodes and analytic boundary update.
  - Verify a total-energy update is exposed before claiming the second curve.
  observables:
  - entropy-ratio
  - energy-drift
  setup_status: requires-setup-reconciliation
  reference_status: analytic-adapter-required
  metric_status: definition-transcribed-not-implemented
  acceptance_status: unscored
  acceptance_criteria: null
  material_model: single-gamma-ideal-gas
  comparison_mode: quantitative-analytic-target
- id: section-4-1-acoustic
  section: '4.1'
  source_pdf_pages:
  - 15
  - 16
  core_family: linear-wave
  registry_case: linearWave
  binding: existing-builder-needs-reconciliation
  priority: P0
  dimension: 1
  figure_targets:
  - '2: density L1 convergence'
  setup:
    domain:
    - - 0
      - 1
    boundaries: periodic
    gamma: 1.6666666666666667
    density: 1
    sound_speed: 1
    pressure: 0.6
    amplitude: 1.0e-06
    wavelength: 1
    initial_fields: 'Eq. (94): delta=A*sin(2*pi*x); rho=1+delta, vx=delta, P=0.6+delta.'
  published_sampling:
    particle_counts:
    - 20
    - 31
    - 50
    - 59
    - 126
    - 200
    - 316
    - 502
    - 796
    - 1261
    - 2000
    placement: uniform initial lattice
  comparison_times:
  - 5
  reference:
    kind: analytic
    locator: Eqs. (94)-(95); linear traveling wave
  measurement:
    density-L1: Unweighted mean(abs(rho_i-rho_exact(x_i,t))) at CURRENT particle positions, Eq. (95).
    density-L1-over-amplitude: Diagnostic normalized by 1e-6, in addition to the published absolute L1.
  setup_gaps:
  - Override Wendland4/Gather defaults to the audited B7/support configuration.
  - Set tLimit=5 and CFL=0.25; reconcile the case initialConditions dt override with adaptive time stepping.
  - Set viscosity C_l=2 rather than the solver default 1; verify limiter/compatible energy.
  - Store float64 density and positions; quantify initial sampler error before interpreting convergence.
  observables:
  - density-L1
  - density-L1-over-amplitude
  setup_status: requires-setup-reconciliation
  reference_status: analytic-linear-wave-implemented
  metric_status: python-density-reference-and-synthetic-tests
  acceptance_status: unscored
  acceptance_criteria: null
  convergence:
    expected_order: 2
    fit: Fit log(L1) versus log(1/N); report fit interval, pairwise orders and roundoff plateau.
  material_model: single-gamma-ideal-gas
  comparison_mode: quantitative-analytic-target
