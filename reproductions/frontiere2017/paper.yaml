      bounds:
      - - 0.25
        - 0.75
      - - 0.25
        - 0.75
      density: 4
    ambient_density: 1
  published_sampling:
    lattice:
    - 100
    - 100
    placement: uniform spacing, varying particle masses; not equal-mass spacing
  comparison_times:
  - 0
  - 7
  reference:
    kind: analytic
    locator: Stationary contact discontinuity in Section 4.2
  measurement:
    spurious-velocity: RMS and maximum speed; exact stationary state has zero velocity.
    pressure-error: L1 deviation from P=1.
    interface-deformation: Density images and tracked dense-region boundary; scalar shape diagnostic is an
      extension, not a published tolerance.
  setup_gaps:
  - Override gamma=5/3, rho_high=2 and tLimit=10 defaults.
  - Confirm initial pressure=1 in sampler; E0 is an unused legacy label.
  - Verify uniform spacing/varying masses and density-volume treatment; Appendix B equal-mass variant is a
    distinct study.
  observables:
  - spurious-velocity
  - pressure-error
  - interface-deformation
  setup_status: requires-setup-reconciliation
  reference_status: analytic-adapter-required
  metric_status: definition-transcribed-not-implemented
  acceptance_status: unscored
  acceptance_criteria: null
  material_model: single-gamma-ideal-gas
