    species_fractions_or_reactions_required: false
comparison_policy:
  initial_qualitative_allowed: true
  when: No good available reference, or obtaining one would require a new solver.
  requirements:
  - Keep exact physical setup and numerical realization documented.
  - Compare published figures at matched times, slices, coordinates and color scales.
  - Record visual agreement separately from numerical reference-error acceptance.
  - Use available scalar diagnostics without treating them as validated against absent reference data.
  reference_solver_development_required: false
  quantitative_upgrade: Add trusted data and a measurement operator when feasible; do not block initial qualitative
    comparison.
